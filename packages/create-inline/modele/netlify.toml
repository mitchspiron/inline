# Configuration de l'hébergeur Netlify, pendant de wrangler.toml pour Cloudflare.
#
# Aucun secret ici. Les variables se déclarent dans la configuration du site
# (Site configuration → Environment variables), jamais dans le dépôt.
#
# Les routes ne sont pas décrites dans ce fichier : la fonction déclare
# elle-même le chemin qu'elle sert, et la liste des routes vit dans
# src/lib/api.ts.

[build]
  # Deux temps : le site statique, puis la fonction assemblée en ESM autonome.
  # Voir scripts/build-netlify.mjs — netlify/functions/ est produit, pas écrit.
  command = "npm run build && npm run build:netlify"
  publish = "dist"

[build.environment]
  # Le site est statique ; seule la fonction tourne sous Node.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # « node_bundler » n'est volontairement PAS déclaré.
  #
  # Avec « esbuild », Netlify produit du CommonJS : l'export par défaut devient
  # « exports.default », la fonction est prise pour une v1, et l'exécution
  # appelle « handler » qui n'existe pas — 502 au moment d'entrer la clé.
  # La fonction déposée ici est déjà assemblée : Netlify n'a rien à faire.

# « netlify dev » : le serveur de développement d'Astro sert les pages, Netlify
# ajoute /api/* par-dessus. Lancer « npm run build:netlify » une fois avant.
# Les variables sont lues dans .env, pas .dev.vars — voir README.
[dev]
  command = "npm run dev"
  targetPort = 4321
  framework = "#custom"
